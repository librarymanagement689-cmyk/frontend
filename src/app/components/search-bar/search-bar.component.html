<div class="search-bar" role="search" aria-label="Search books">
  <div class="search-bar__inner">

    <!-- Search input -->
    <div class="search-bar__input-wrap">
      <svg class="search-bar__icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <label for="search-query" class="sr-only">Search books</label>
      <input
        id="search-query"
        type="search"
        class="search-bar__input"
        [(ngModel)]="query"
        (ngModelChange)="onQueryChange($event)"
        placeholder="Search books by title, author or category..."
        autocomplete="off"
        aria-label="Search books by title, author or category"
      >
    </div>

    <!-- Divider -->
    <div class="search-bar__divider" aria-hidden="true"></div>

    <!-- Category -->
    <div class="search-bar__select-wrap">
      <label for="search-category" class="sr-only">Filter by category</label>
      <select
        id="search-category"
        class="search-bar__select"
        [(ngModel)]="selectedCategory"
        aria-label="Filter by category"
      >
        <option value="">All Categories</option>
        @for (cat of categories(); track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
      <svg class="search-bar__select-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </div>

    <!-- Divider -->
    <div class="search-bar__divider" aria-hidden="true"></div>

    <!-- Language -->
    <div class="search-bar__select-wrap">
      <label for="search-language" class="sr-only">Filter by language</label>
      <select
        id="search-language"
        class="search-bar__select"
        [(ngModel)]="selectedLanguage"
        aria-label="Filter by language"
      >
        <option value="">All Languages</option>
        @for (lang of languages(); track lang) {
          <option [value]="lang">{{ lang }}</option>
        }
      </select>
      <svg class="search-bar__select-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </div>

    <!-- Search button -->
    <button
      type="button"
      class="search-bar__btn btn btn--primary"
      (click)="onSearch()"
      aria-label="Search books"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      Search
    </button>

  </div>
</div>
